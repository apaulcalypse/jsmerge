[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jsmerge"
version = "0.2.0"
description = "Sort and merge Juniper Junos configurations to canonical show-configuration order"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyang>=2.7",
]
build-schema = [
    "pyang>=2.7",
]
fast = [
    "orjson>=3.9",
]

[project.scripts]
jsmerge = "jsmerge.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/jsmerge"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "jsmerge/schema/bundles"

[tool.hatch.build.targets.sdist]
include = ["src/jsmerge", "schemas", "docs"]
exclude = ["schemas/*.json.cache"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: integration tests that compile YANG (may take ~90s)",
]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingModuleSource = false
